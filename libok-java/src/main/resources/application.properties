spring.application.name=LiBok

# O LiBok roda somente na máquina local: o servidor nunca fica exposto na rede.
server.address=127.0.0.1
server.port=${libok.porta:8765}
server.servlet.session.timeout=8h

# Pasta de dados definida em LibokApplication (%APPDATA%\LiBok no Windows, ~/.libok nos demais).
spring.datasource.url=jdbc:sqlite:${libok.pasta-dados}/libok.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita um único escritor por vez; poucas conexões e busy_timeout evitam "database is locked".
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.main.banner-mode=off
logging.file.name=${libok.pasta-dados}/libok.log
logging.level.root=WARN
logging.level.br.com.libok=INFO
server.servlet.session.tracking-modes=cookie
